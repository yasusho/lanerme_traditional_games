<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIL LIME Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PeerJS for P2P communication -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* Temporary inline styles for immediate feedback before style.css loads/is perfected */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
    <!-- Setup Modal -->
    <div id="setup-modal-overlay" class="modal-overlay">
        <div class="modal-content setup-modal">
            <h2>AIL LIME Simulator Setup</h2>
            <div class="setup-section">
                <label>プレイヤー人数:</label>
                <div id="p2p-player-hint" style="display: none; font-size: 0.9em; color: #666; margin-top: 5px;">
                    P2Pモード: 参加者の人数を選択してください
                </div>
                <div class="player-count-buttons">
                    <button class="count-btn active" data-count="2">2</button>
                    <button class="count-btn" data-count="3">3</button>
                    <button class="count-btn" data-count="4">4</button>
                    <button class="count-btn" data-count="5">5</button>
                </div>
            </div>
            <!-- Game Mode Selection -->
            <div class="setup-section" style="margin-top: 15px;">
                <label>ゲームモード:</label>
                <div class="game-mode-buttons" style="display: flex; gap: 10px; margin-top: 8px;">
                    <button class="mode-btn active" data-mode="local">ローカル</button>
                    <button class="mode-btn" data-mode="host">P2Pホスト</button>
                    <button class="mode-btn" data-mode="guest">P2P参加</button>
                </div>
            </div>
            
            <!-- P2P Host Info (hidden by default) -->
            <div id="p2p-host-section" class="setup-section" style="display: none; margin-top: 15px;">
                <label>あなたの名前:</label>
                <input type="text" id="player-name-host" placeholder="プレイヤー名" value="" style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;">
                <label>ルームID:</label>
                <div id="room-id-display" style="font-family: monospace; font-size: 1.2em; padding: 10px; background: #e0e0e0; border-radius: 5px; margin-top: 5px;"></div>
                <div id="p2p-waiting" style="margin-top: 10px; color: #666;">プレイヤーの参加を待っています...</div>
                <div id="p2p-connected" style="display: none; margin-top: 10px; color: green;">✓ 相手が接続しました！</div>
            </div>
            
            <!-- P2P Guest Input (hidden by default) -->
            <div id="p2p-guest-section" class="setup-section" style="display: none; margin-top: 15px;">
                <label>あなたの名前:</label>
                <input type="text" id="player-name-guest" placeholder="プレイヤー名" value="" style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;">
                <label>ホストのルームIDを入力:</label>
                <input type="text" id="room-id-input" placeholder="AIL-XXXXXX" style="width: 100%; padding: 10px; margin-top: 5px; font-family: monospace; font-size: 1.1em; border: 1px solid #ccc; border-radius: 5px;">
                <button id="btn-connect-p2p" class="btn-secondary" style="margin-top: 10px; width: 100%;">接続</button>
                <div id="p2p-connection-status" style="margin-top: 10px;"></div>
            </div>
            
            <div class="setup-actions">
                <button id="btn-start-normal" class="btn-primary">ゲーム開始 (自分＋AI)</button>
                <button id="btn-start-simulation" class="btn-secondary">AI対戦シミュレーション開始</button>
                <button id="btn-start-p2p" class="btn-primary" style="display: none;">P2P対戦開始</button>
            </div>
        </div>
    </div>

    <!-- Action Prompt (Floating notification) -->
    <div id="action-prompt" style="
        display: none;
        font-size: 1.2rem; 
        font-weight: bold; 
        color: white; 
        background: linear-gradient(135deg, #3498db, #2980b9);
        padding: 12px 24px; 
        border-radius: 12px; 
        text-align: center; 
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        animation: pulse 2s infinite;
        transition: all 0.3s ease;
    "></div>
    <style>
        @keyframes pulse {
            0% { box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 8px 35px rgba(52, 152, 219, 0.6); }
            100% { box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        }
    </style>

    <div id="game-container" style="display:none;">
        <!-- Header -->
        <div class="game-header">
            <h1>AIL LIME</h1>
            <div id="game-info">
                <span>Round: <span id="current-round">1</span></span>
                <span style="margin-left: 20px;">Remaining RT: <span id="remaining-rt">0</span></span>
                <span style="margin-left: 20px;">Phase: <span id="current-phase">Setup</span></span>
            </div>
        </div>

        <!-- Main Content (Sidebar + Map) -->
        <div class="main-area">
            <!-- Sidebar: Opponents -->
            <div id="sidebar" class="sidebar">
                <div id="opponents-area">
                    <!-- Opponents injected here -->
                </div>
                <!-- Logs moved here for compactness -->
                <div id="log-area">
                    <div class="log-entry">Welcome to AIL LIME.</div>
                </div>
            </div>

            <!-- Map -->
            <div id="map-container" class="map-container">
                <div class="map-wrapper">
                    <img id="game-map-image" src="../map.svg" alt="Game Map">
                    <div id="tokens-layer"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Panel: Human Player -->
        <div id="human-player-area" class="bottom-panel">
            <!-- Human player HUD injected here -->
        </div>
        
        <!-- Action Buttons Overlay or Footer -->
        <div id="action-panel" style="position: fixed; bottom: 20px; right: 20px; z-index: 100;">
            <button id="btn-next-phase" disabled>Next Phase</button>
            <div id="dynamic-actions"></div>
        </div>

        <!-- Payment Modal -->
        <div id="payment-modal-overlay" class="modal-overlay hidden">
            <div class="modal-content">
                <h2>資源の支払い選択</h2>
                <div id="payment-options"></div>
                <div class="modal-footer">
                    <button id="btn-pay-cancel" class="btn-secondary">キャンセル</button>
                    <button id="btn-pay-confirm" class="btn-primary" disabled>支払う</button>
                </div>
            </div>
        </div>

        <!-- Results Modal -->
        <div id="results-modal-overlay" class="modal-overlay hidden">
            <div class="modal-content" style="max-width:600px;">
                <h2>ゲーム終了結果</h2>
                <div id="results-summary"></div>
                <div class="modal-footer">
                    <button id="btn-restart" class="btn-primary">新しいゲームを開始</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="map_data.js"></script>
    <script src="cards.js"></script>
    <script src="network.js"></script>
    <script src="game.js?v=20260106x"></script>
</body>
</html>
